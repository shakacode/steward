[package]
name = "steward"
description = "Task runner and process manager for Rust"
version = "0.0.10"
authors = ["Alex Fedoseev <alex@35mil.me>"]
readme = "./README.md"
homepage = "https://github.com/alexfedoseev/steward"
repository = "https://github.com/alexfedoseev/steward"
documentation = "https://docs.rs/steward"
license = "MIT"
edition = "2021"
rust-version = "1.85"
keywords = ["command", "process", "env"]
exclude = ["examples/*"]
autoexamples = false

[features]
default = ["tls"]
tracing = ["dep:tracing"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "net", "time", "process", "signal", "io-util", "macros"] }
console = "0.14.1"
thiserror = "2"
rand = "0.9"
async-trait = "0.1.50"
tracing = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tls = { package = "hyper-tls", version = "0.6", features = ["vendored"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "env_bench"
harness = false

[[bench]]
name = "cmd_bench"
harness = false
