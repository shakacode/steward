name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo test
        run: cargo test

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Audit suppressions — all transitive dependencies with no patched release available:
      #   RUSTSEC-2023-0022: openssl X509NameBuilder::build not thread-safe (via hyper-tls)
      #   RUSTSEC-2023-0023: openssl SAN/ExtendedKeyUsage injection (via hyper-tls)
      #   RUSTSEC-2023-0024: openssl crash on None context arg (via hyper-tls)
      #   RUSTSEC-2023-0044: openssl buffer over-read in set_host <0.10.55 (via hyper-tls)
      #   RUSTSEC-2023-0072: openssl X509StoreRef::objects aliasing (via hyper-tls)
      #   RUSTSEC-2023-0018: remove_dir_all symlink TOCTOU race (transitive dev-dep)
      #   RUSTSEC-2024-0357: openssl MemBio::get_buf UB on empty buffer (via hyper-tls)
      #   RUSTSEC-2025-0004: openssl lifetime mismatch in protocol selection (via hyper-tls)
      - name: Run cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2023-0022
          --ignore RUSTSEC-2023-0023
          --ignore RUSTSEC-2023-0024
          --ignore RUSTSEC-2023-0044
          --ignore RUSTSEC-2023-0072
          --ignore RUSTSEC-2023-0018
          --ignore RUSTSEC-2024-0357
          --ignore RUSTSEC-2025-0004

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.85.0"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Verify build on MSRV
        run: cargo check --all-targets
